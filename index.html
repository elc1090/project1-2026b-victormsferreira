<html>
  <head>
    <title>Image Annotator</title>
    <link rel="stylesheet" href="index.css"/>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico" type="image/x-icon"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  </head>
  <body>
    <div class="header">
      <h2> Image Annotator</h2>
      <div class="toolbar">
        <div class="image-list-tools">
          <label class="image-upload">
            <input id="image-picker" type="file" accept="image/*" multiple/>
            Add Files
          </label>
          <label class="image-upload">
            <input id="image-capture" type="file" accept="image/*" multiple capture="user"/>
            Capture
          </label>
          <button id="remove" class="tool-button">Remove</button>
        </div>
        <div class="viewport-tools">
          <button id="select" class="tool-button current">Select</button>
          <button id="draw" class="tool-button">Draw</button>
          <button id="delete" class="tool-button">Delete</button>
          <button id="zoom-out" class="tool-button">-</button>
          <button id="zoom-display" class="tool-button">100%</button>
          <button id="zoom-in" class="tool-button">+</button>
          <button id="export-json" class="tool-button">Export JSON</button>
          <label class="image-upload">
            <input id="import-json" type="file" accept="text/plain"/>
            Import JSON
          </label>
          <p>Wheel to zoom. Drag to pan</p>
        </div>
        <div class="toolbar-annotation">
          <h2>Annotation</h2>
        </div>

      </div>
    </div>

    <div class="main-app">
      <div id="image-list" class="image-list"></div>
      <div class="viewport" id="viewport">
        <div id="viewport-items" class="viewport-items">
          <img id="main-image">
            <div id="annotations-container" class="annotations-container"></div>
          </img>
        </div>
      </div>
      <div class="annotation-editor" id="properties-box">
        <div id="tag-editor">
          <label for="tag-input">Tag:
            <input type="text" id="tag-input" name="tag"/>
          </label>
        </div>
        <div class="infobox" id="note-x">
          <span class="label">X</span>
          <b class="info">0</b>
        </div>
        <div class="infobox" id="note-y">
          <span class="label">Y</span>
          <b class="info">0</b>
        </div>
        <div class="infobox" id="note-w">
          <span class="label">Width</span>
          <b class="info">0</b>
        </div>
        <div class="infobox" id="note-h">
          <span class="label">Height</span>
          <b class="info">0</b>
        </div>
        <div class="infobox" id="color-box">
          <label>Annotation Color:
            <input type="color" id="color-input" name="color"/>
          </label>
        </div>
        <div class="infobox" id="alpha-box">
          <label>Opacity:
            <input type="range" id="opacity-input" name="opacity" min="0" max="100"/>
          </label>
        </div>
        <div class="infobox" id="tag-font-size">
          <label>Font Size:
            <input type="number" id="tag-font-size-input" name="font-size" min="8" max="80"/>
          </label>
        </div>
        <div class="infobox" id="tag-circular">
          <label>Circle:
            <input type="checkbox" id="tag-circular-input" name="tag-circle"/>
          </label>
        </div>
      </div>
    </div>
  </body>

  <script src="javascript.js"></script>

</html>
